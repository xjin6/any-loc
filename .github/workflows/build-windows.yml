name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build AnyLoc.exe
        shell: pwsh
        run: .\scripts\build-win.ps1 -PythonExe python

      - name: Record SHA-256
        shell: pwsh
        run: Get-FileHash .\platforms\windows\dist\AnyLoc.exe -Algorithm SHA256 | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyLoc-Windows
          path: platforms/windows/dist/AnyLoc.exe
          if-no-files-found: error
          retention-days: 7
